# Copy to the target host and pin QQBOT_IMAGE to the verified CI image digest.
services:
  bridge:
    image: ${QQBOT_IMAGE}
    container_name: qqbot-bridge
    restart: unless-stopped
    init: true
    mem_limit: 1200m
    pids_limit: 160
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./data/bridge:/data
      - ./config:/run/qqbot:ro
      - ./secrets/bridge-token:/run/secrets/bridge-token:ro
      - ./secrets/onebot-token:/run/secrets/onebot-token:ro
    ports: ['127.0.0.1:8787:8787']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  astrbot:
    image: ${ASTRBOT_IMAGE}
    container_name: qqbot-astrbot
    restart: unless-stopped
    init: true
    mem_limit: 800m
    pids_limit: 200
    environment: {TZ: Asia/Shanghai}
    volumes:
      - ./data/astrbot:/AstrBot/data
      - ./source/astrbot_plugin:/AstrBot/data/plugins/sub2api_dsh_bridge:ro
      - ./config:/run/qqbot:ro
      - ./secrets/bridge-token:/run/secrets/bridge-token:ro
    ports: ['127.0.0.1:6185:6185']
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  router:
    image: ${QQBOT_IMAGE}
    container_name: qqbot-router
    command: [node, src/router.mjs]
    restart: unless-stopped
    init: true
    mem_limit: 192m
    pids_limit: 50
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./config:/run/qqbot:ro
      - ./secrets/onebot-token:/run/secrets/onebot-token:ro
      - ./secrets/astrbot-token:/run/secrets/astrbot-token:ro
      - ./secrets/bridge-token:/run/secrets/bridge-token:ro
    ports: ['127.0.0.1:6200:6200']
    networks: [default, napcat]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  napcat:
    external: true
    name: napcat_default
