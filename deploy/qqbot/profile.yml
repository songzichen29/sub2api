- id: llm-deepseek
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-fs
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT
- insert:
    - id: qqbot-model
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          qqbot-site:
            apiKeyEnv: QQBOT_MODEL_API_KEY
            api: !!js process.env.QQBOT_MODEL_API || 'openai-responses'
            baseURL: !!js process.env.QQBOT_MODEL_BASE_URL
            retryPolicy:
              mode: normal
              maxRetries: 0
            models:
              - id: !!js process.env.QQBOT_MODEL
                name: QQBot site model
                contextWindow: !!js Number(process.env.QQBOT_CONTEXT_WINDOW || '65536')
                maxTokens: !!js Number(process.env.QQBOT_MAX_OUTPUT_TOKENS || '4096')
                input: [text, image]
