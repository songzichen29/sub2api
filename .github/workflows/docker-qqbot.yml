name: Build QQBot Runtime
on:
  push:
    branches: [merge/upstream-main-into-pgsql-mysql-20260426]
    paths: [deploy/qqbot/**, .github/workflows/docker-qqbot.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test QQ media transport
        run: python -m unittest discover -s deploy/qqbot/test -p '*_test.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/qqbot-runtime
          tags: |
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: deploy/qqbot
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
