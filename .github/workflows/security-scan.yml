name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Run govulncheck
        working-directory: backend
        run: |
          set +e
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -json ./... > govulncheck.json 2>&1
          status=$?
          echo "govulncheck_exit_code=$status"
          if [ "$status" -ne 0 ]; then
            sed -n '1,20p' govulncheck.json | while IFS= read -r line; do
              line=${line//$'\r'/}
              line=${line//%25/%2525}
              line=${line//%0A/%250A}
              line=${line//%0D/%250D}
              echo "::error file=backend/go.mod,line=1::$line"
            done
          fi
          exit "$status"
      - name: Upload govulncheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-diagnostics
          path: backend/govulncheck.json
          if-no-files-found: ignore
          retention-days: 7

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
