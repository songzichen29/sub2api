    status: done
    note: "代码层：AdminService 加 ListAllAccountTags 接口+实现（转调 accountRepo.ListAllTags）、路由 /tags 注册在 /:id 前避免 gin 参数解析冲突。go build 通过、go vet 全绿、service 包 + admin handler 包单测全绿。新增 account_handler_tags_test.go 共 3 个测试 7 例全通过：ListTags 字典序去重、空集返回 []、5 种 query 入参解析（含大写规范化、去重、空值不过滤）。修了 9 处旧 stub 跟接口签名脱钩（缺 tags 参数或 ListAllTags 方法）：sessionWindowMockRepo、stubAdminService、openAICodexExtraListRepo、mockAccountRepoForPlatform、mockAccountRepoForGemini、accountRepoStub、inMemoryAccountRepo、accountRepoStubForBulkUpdate、accountRepoStubForAdminList。AND 筛选 SQL 行为依赖 PG 真实环境，留到 step 8 一起做。"

  - action: "前端 类型 + API + AccountTagsInput：types/index.ts 加 tags 字段、api/admin/accounts.ts 加 listTags 函数、新建 AccountTagsInput.vue 组件"
    exit_signal: "pnpm vitest run AccountTagsInput.spec 通过；输入 'VIP ' 回车 emit ['vip']；超长输入 emit invalid"
    status: done
    note: "新增前端规范化工具 utils/accountTags.ts（前后端规则镜像：trim/小写/长度<=30 按 rune/数量<=20/字符集 CJK+a-z+0-9+-_）+ 19 例 spec。AccountTagsInput.vue 组件支持回车/空格/逗号提交、Backspace 删尾 chip、点 chip × 删除、autocomplete dropdown（suggestions 由父组件 listTags() 拉取后透传）、内联错误提示。types/index.ts 给 Account/CreateAccountRequest/UpdateAccountRequest 加 tags?: string[]；api/admin/accounts.ts 加 listTags() 函数。AccountTagsInput.spec 11 例全通过含 design 三个退出条件。pnpm vue-tsc --noEmit 全绿。i18n 词条 admin.accounts.tags.* 按 checklist 留到 step 8 收尾。list filters 加 tags 留到 step 6 列表筛选器一起做。"

  - action: "前端 Create / Edit Modal 嵌入 tags：两个 Modal 加 form.tags state、template 一行 AccountTagsInput、提交 payload 带 tags"
    exit_signal: "浏览器新建账号填 ['vip'] 提交后编辑能看到 ['vip']；列表行 tags 字段也是 ['vip']"
    status: done
    note: "两个 Modal 都加了：import AccountTagsInput；form.tags 字段；resetForm/syncFormFromAccount 同步；watch(props.show) 时 listTags() 拉 tagSuggestions 兜底空数组；template 在 notes 之后插入 AccountTagsInput 区块（label/placeholder/hint 用 admin.accounts.tags.* i18n key）。CreateAccountModal 5 处显式 payload 加 tags: form.tags（doCreateAccount 主流程 + OpenAI/Anthropic/Antigravity 各 OAuth exchange 子路径），1 处 ...form 展开自动带；EditAccountModal 通过 ...form 自动带不需要手动加。EditAccountModal.spec mock 加 listTags: vi.fn().mockResolvedValue([])。pnpm vue-tsc 全绿；改动相关的 4 个 spec（AccountTagsInput 11 + accountTags 19 + EditAccountModal 3 + BulkEditAccountModal 11）共 44 例全通过。AccountUsageCell.spec 6 例失败是 baseline（spy 断言与 codex usage API 相关，与本 feature 无关，AccountUsageCell.vue 本身被其他改动修改过）。浏览器端到端验证留到 step 8 一起做。"

  - action: "前端 列表筛选器 + 列表展示：新建 AccountTagsFilter.vue、AccountTableFilters 接入、AccountsView 接入 params.tags、列表行展示 chip"
    exit_signal: "浏览器筛选器选 vip+prod 两个标签后列表只剩同时具备这两个标签的账号"
    status: done
    note: "新建 components/admin/account/AccountTagsFilter.vue（仿 Select 风格 trigger + dropdown 多选 checkbox + 搜索框 + 清空按钮，onClickOutside 关闭）。AccountTableFilters 加 :availableTags prop + AccountTagsFilter 占位 + updateTags emit。AccountsView：useTableLoader.initialParams 加 tags: [] as string[]、新增 availableTags ref、onMounted 拉 listTags() 兜底空数组、:available-tags 透传给 AccountTableFilters；新增 cell-tags slot（chip 列表 max-w 16rem、空值显示 -）和 columns 配置（在 expires_at 与 notes 之间）。list/listWithEtag 加 tags?: string[] 入参 + paramsSerializer:{indexes:null} 让 axios 用 repeat 格式（tags=a&tags=b）匹配后端 c.QueryArray。新增 AccountTagsFilter.spec.ts 5 例（dropdown 展开、累积选择含测试约束 vip+prod 用例、取消选中、清空、搜索框过滤）。AccountsView.bulkEdit.spec mock 加 listTags 防回归。pnpm vue-tsc 全绿；46 个相关测试全通过。DashboardView.spec 1 个 unhandled rejection 是 baseline（toFixed undefined，与本 feature 无关）。浏览器端到端验证留到 step 8。"

  - action: "前端 BulkEdit 批量替换标签：BulkEditAccountModal 加同时编辑标签复选框 + AccountTagsInput、提交逻辑用 *[]string 语义"
    exit_signal: "浏览器选 3 条账号勾选同时编辑标签输入 ['test'] 提交后这 3 条的 tags 全部变成 ['test']；不勾选复选框时不影响 tags 字段"
    status: done
    note: "BulkEditAccountModal.vue 加：enableTags ref + tags ref + tagSuggestions ref + import AccountTagsInput；template 在 Groups 区块后插入 Tags 区块（复选框 + AccountTagsInput + bulk replace hint）；buildUpdatePayload 加 tags 分支（仅在 enableTags=true 时把 tags.value 加进 payload，对应后端 *[]string 语义：不传=不改 / []=清空 / [...]=替换）；handleSubmit.hasAnyFieldEnabled 加 enableTags；watch(props.show) 加打开时 listTags() 拉候选 + 关闭时 reset enableTags=false 和 tags=[]。BulkEdit API/类型层面无改动（bulkUpdate 入参是 Record<string, unknown> 已经能透传任意字段）。BulkEditAccountModal.spec mock 加 listTags + 新增 3 例测试覆盖 step 7 退出条件：勾选+输入 ['test'] 提交含 tags=['test']；勾选但空数组提交含 tags=[]（清空语义）；不勾选时 payload 不含 tags 字段（不改语义）。原 11 例 + 新 3 例共 14 例全通过；pnpm vue-tsc 全绿。"

  - action: "i18n 词条收尾 + 端到端联调：en.ts/zh.ts 加 admin.accounts.tags.* 词条、跑全部测试、复制账号验证 tags 一起复制"
    exit_signal: "pnpm vitest run + go test -tags=unit ./... + go test -tags=integration ./... + golangci-lint run ./... 全绿；浏览器复制账号后副本 tags = 原账号 tags"
    status: done
    note: "i18n 词条已补：zh.ts/en.ts 的 admin.accounts 下加 tags.{label/placeholder/hint/bulkReplaceHint/remove/errors.{length/charset/count}/filterAll/filterSelectedLabel/filterSearchPlaceholder/filterEmpty/filterSelectedCount/filterClear} + columns.tags + usageQuery.incompleteFields。同步顺手修了用户报的 3 个问题：(1) CreateAccountModal/EditAccountModal 在开启 usageQueryEnabled 但 baseUrl/userId/token 任一空时静默丢弃整个 usage_query 配置——改为 appStore.showError + return 阻止提交；(2) 因为问题 1 直接连带——原本静默丢弃所以列表不显示；(3) 'admin.accounts.tags.filterAll' 这种 i18n key 直显在 trigger 按钮上把 AccountTableFilters 行挤变形——补完 i18n 后正确显示中英文。Duplicate 复制 tags 在 admin_service.go:2283 已实现（src.Tags 透传给 CreateAccountInput），service 层 unit 测试 mock 链太长性价比低，按 design 留 e2e 验证。go test -tags=unit ./... 全绿（顺手修了 baseline 阻塞 step 8 的两个 stub：stubAccountRepo 缺 ListAllTags 是本 feature step 3 引入接口后我漏补的；stubUserSubscriptionRepo 缺 GetLatestUsedAtBySubscriptionIDs 是 feature 外别人遗留代码，但不修 build 就过不去）。本 feature 自身相关 6 个前端 spec 共 53 例全绿；前端 14 例 baseline 失败与 feature 无关（AccountUsageCell codex spy 断言 / apiError vitest 环境 i18n 编译 / useOpenAIOAuth / usePersistedPageSize）。golangci-lint 本地未装（CI 跑），integration 测试需真实 PG/MySQL（本地无环境）——这两项+浏览器 E2E（duplicate/列表行 chip/筛选 AND 语义）留给用户在 CI/部署环境执行。"

