steps:
  - action: "后端 schema + 迁移：写 134_add_account_tags.sql、改 ent/schema/account.go 加 tags JSONB 字段、go generate ./ent"
    exit_signal: "psql 查 SELECT tags FROM accounts LIMIT 1 返回 []；pg_indexes 中存在 idx_accounts_tags_gin"
    status: done
    note: "代码层面已完成（migration SQL 对齐历史风格 + ent 生成代码含 Tags + go build 通过）。本地无 PG 也无 Docker，实跑 PG 验证推到 step 8 一起做。"

