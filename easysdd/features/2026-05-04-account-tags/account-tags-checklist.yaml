    exit_signal: "account_service_tags_test.go 中创建后再读取附带 tags 的账号用例通过；go test -tags=unit ./backend/internal/service/... 全绿"
    status: done
    note: "service 包全部 unit 测试 100s 通过。规范化测试 14 例（六条规则正反例 + 边界）+ Create/Update/Read 闭环 5 例。NormalizeAccountTags 放新文件 account_tags.go（避免追加到已 2200 行的 account.go）。前置仓库本身存在 stubUserSubscriptionRepo 缺 GetLatestUsedAtBySubscriptionIDs 方法导致 internal/server 包 build 失败——和本 feature 无关，不动。"

  - action: "后端 List 加 tags 筛选 + ListTags 接口：ListWithFilters 加 tags 入参拼 JSONB @> 谓词、handler 解析 c.QueryArray、新增 ListTags handler 和 GET /admin/accounts/tags 路由"
